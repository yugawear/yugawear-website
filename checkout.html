    <link rel="canonical" href="https://yugawear.com/">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        rel="stylesheet">

    <!-- Structured Data -->
    <script type="application/ld+json">

        {
        "@context":"https://schema.org",
        "@type":"Organization",

        "name":"YUGA WEAR",

        "url":"https://yugawear.com",

        "logo":"https://yugawear.com/images/logo.jpg",

        "sameAs":[
            "https://instagram.com/yuga.wear"
        ]

        }

        </script>

<body>


<!-- ===========================
            NAVBAR
    ============================= -->
<div id="globalNavbar"></div>

<!-- Hero Section -->
<section class="checkout-hero">

    <div class="container">

        <h1>Checkout</h1>

        <p>

            Complete your order securely.

        </p>

    </div>

</section>

<!-- Main Layout -->
 <section class="checkout-page">

    <div class="container">

        <div class="checkout-layout">

            <div class="checkout-form">

    <!-- ==========================
            CONTACT
    =========================== -->

    <div class="checkout-section">

        <div class="section-title">

            <i class="fa-regular fa-user"></i>

            <h2>Contact Information</h2>

        </div>

        <div class="form-group">

            <label>Full Name</label>

            <input
                type="text"
                id="customerName"
                placeholder="John Doe">

        </div>

        <div class="form-group">

            <label>Email Address <span>(Optional)</span></label>

            <input
                type="email"
                id="customerEmail"
                placeholder="john@example.com">

        </div>

        <div class="form-group">

            <label>Phone Number</label>

            <div class="phone-input">

                <span>🇮🇳 +91</span>

                <input
                    type="tel"
                    id="customerPhone"
                    maxlength="10"
                    placeholder="9876543210">

            </div>

        </div>

    </div>


    <!-- ==========================
            SHIPPING
    =========================== -->

    <div class="checkout-section">

        <div class="section-title">

            <i class="fa-solid fa-location-dot"></i>

            <h2>Shipping Address</h2>

        </div>

        <div class="form-group">

            <label>Address</label>

            <textarea
                id="customerAddress"
                rows="4"
                placeholder="House No, Street, Area"></textarea>

        </div>

        <div class="form-row">

            <div class="form-group">

                <label>City</label>

                <input
                    type="text"
                    id="customerCity">

            </div>

            <div class="form-group">

                <label>State</label>

                <input
                    type="text"
                    id="customerState">

            </div>

        </div>

        <div class="form-group">

            <label>PIN Code</label>

            <input
                type="text"
                maxlength="6"
                id="customerPin"
                placeholder="560001">

        </div>

    </div>

</div>

            <aside class="checkout-summary">

                <!-- Order summary -->
                 <h2>Order Summary</h2>

                <div id="checkoutItems">

                    <!-- Rendered by JS -->

                </div>

                <hr>

                <div class="summary-row">

                    <span>Subtotal</span>

                    <strong id="checkoutSubtotal">

                        ₹0

                    </strong>

                </div>

                <div class="summary-row">

                    <span>Shipping</span>

                    <strong style="color: #F26A21;">

                        FREE

                    </strong>

                </div>

                <div class="summary-total">

                    <span>Total</span>

                    <strong id="checkoutTotal">

                        ₹0

                    </strong>

                </div>

                <button
                    class="checkout-button"
                    id="placeOrder">

                    Place Order on WhatsApp →

                </button>

            </aside>

        </div>

    </div>

</section>

<!-- ==========================================
     GLOBAL FOOTER
========================================== -->

<div id="globalFooter"></div>


<!-- ==========================================
     GLOBAL CART
========================================== -->

<div id="globalCart"></div>

========================================== -->

<script src="js/components.js"></script>

<script src="js/checkout.js"></script>




</body> 

</html>
